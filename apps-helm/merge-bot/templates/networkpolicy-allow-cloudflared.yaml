---
# The chart's NetworkPolicy only admits the ingress controller's
# namespace; the tunnel pods dial the bot directly, so admit them too
# (policies are additive).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merge-bot-allow-cloudflared
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: merge-bot
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8080
