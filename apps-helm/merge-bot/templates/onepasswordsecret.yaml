---
# Bot credentials, loaded as env via the chart's existingSecret. The item
# needs fields labeled GITLAB_TOKEN and WEBHOOK_SECRETS (comma-separated).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: merge-bot
spec:
  itemPath: "vaults/Kubernetes/items/Merge Bot"
---
# GitLab registry pull credentials (the image is private). The item needs
# a single field labeled `.dockerconfigjson` holding
# {"auths":{"registry.gitlab.com":{"auth":"<base64 of user:token>"}}} from a
# merge-bot project deploy token with read_registry only.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: merge-bot-registry-pull
type: kubernetes.io/dockerconfigjson
spec:
  itemPath: "vaults/Kubernetes/items/GitLab Registry Pull - Merge Bot"
---
# Tunnel credentials; the item needs a field labeled credentials.json
# holding the file `cloudflared tunnel create merge-bot` wrote.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: merge-bot-cloudflared-secret
spec:
  itemPath: "vaults/Kubernetes/items/Cloudflared - Merge Bot"
