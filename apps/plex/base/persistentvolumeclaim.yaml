---
# The pod is pinned to amleyg00, so replicas on other nodes buy no
# availability and only add writes to the etcd SSDs (plan 15.1): the live
# volume is patched to 1 replica by hand. storageClassName is immutable once
# bound - use longhorn-1replica if this PVC is ever recreated.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc
spec:
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-tv-pv
spec:
  capacity:
    storage: 10Gi  # This is a placeholder value, it's not enforced for NFS
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume1/media/TV Shows
    server: 192.168.40.118
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-tv-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""  # Empty storage class to bind to the PV above
  volumeName: plex-tv-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-movies-pv
spec:
  capacity:
    storage: 10Gi  # This is a placeholder value, it's not enforced for NFS
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume1/media/Movies
    server: 192.168.40.118
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-movies-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""  # Empty storage class to bind to the PV above
  volumeName: plex-movies-pv
  resources:
    requests:
      storage: 10Gi
