---
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A floating or missing image tag defeats Renovate-driven pinning and makes
      rollbacks ambiguous. This audits any container whose image is untagged or
      tagged `latest`.
spec:
  failurePolicy: Ignore
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: "object.spec.containers.all(c, c.image.contains(':'))"
      message: "An image tag is required."
    - expression: "object.spec.containers.all(c, !c.image.endsWith(':latest'))"
      message: "Using a mutable image tag e.g. `latest` is not allowed."
